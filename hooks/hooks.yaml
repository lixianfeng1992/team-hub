hooks:
  - id: i-have-adhd-always-on
    description: Inject i-have-adhd rules at session start
    event: SessionStart
    # User scope: the team repo lives at $HOME/.teamai/team-repo. Keep the
    # command free of nested quote escaping — a complex inline sh -c chain with
    # escaped quotes did not survive being written into settings.json reliably.
    command: 'sh "$HOME/.teamai/team-repo/scripts/always-on.sh"'
    timeout: 30
    tools: [claude]
